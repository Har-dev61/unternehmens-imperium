# nginx-Site für Unternehmens-Imperium
# Ablage: /etc/nginx/sites-available/imperium  (dann nach sites-enabled verlinken)
#
# Serviert die statischen Dateien aus /var/www/imperium und leitet /api/ an das
# Node-Backend (127.0.0.1:3000) weiter. Da Seite und API über denselben Host
# laufen, entfällt CORS komplett.

server {
    listen 80;
    listen [::]:80;
    server_name game.example.com;   # ← deine Domain (oder server-IP)

    root /var/www/imperium;
    index index.html;

    # Statische Spieldateien (index.html, css/, js/)
    location / {
        try_files $uri $uri/ =404;
    }

    # Backend-API → Node/Express
    location /api/ {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # JS-Module mit korrektem MIME-Typ + moderates Caching
    location ~* \.(js|css|map)$ {
        add_header Cache-Control "public, max-age=3600";
    }

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
}
